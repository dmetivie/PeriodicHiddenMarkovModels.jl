julia = "1.12"
ArgCheck = "2"
StatsAPI = "1.6"
# The lower bound is not cosmetic. Up to v0.5, `forward_backward!` built `ξ[t]` with
# `transition_matrix(hmm, control_seq[t])`; from v0.6 it uses `control_seq[t + 1]`, so a
# transition matrix is indexed by the period of the step it *arrives at*. `fit!` here groups
# `ξ` the v0.6 way, and on v0.5 it would be off by one step — see CHANGELOG v0.3.2.
HiddenMarkovModels = "0.6, 0.7"
